[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artificial-self-model-v0"
version = "0.2.0"
description = "Research scaffold for functional self-modeling experiments in language-model agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
frontier = ["openai>=1.0", "anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
asm-v0 = "asm_v0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
